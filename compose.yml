services:
  jenkins:
    container_name: jenkins
    image: docker.io/jenkins/jenkins:lts
    user: "${HOST_UID:-1003}:${HOST_GID:-1003}"
    ports:
      - 0.0.0.0:${JENKINS_PORT_EXTERNAL:-1080}:${JENKINS_PORT_INTERNAL:-80}
    volumes:
      - ./service/jenkins_home:/var/jenkins_home
    environment:
      - JENKINS_OPTS=--httpPort=${JENKINS_PORT_INTERNAL:-80}
    restart: always
    networks:
      - jenkins_net
    healthcheck:
      test: curl -fsSL http://localhost:${JENKINS_PORT_INTERNAL:-80}/login || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s


  nginx:
    image: nginx:stable
    container_name: nginx
    ports:
      - "0.0.0.0:${FIREWALL_PORT_EXTERNAL:-80}:${FIREWALL_PORT_INTERNAL:-8080}"
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-workflows.iciq.es}
      - NGINX_LISTEN_PORT=${FIREWALL_PORT_INTERNAL:-8080}
      - NGINX_ADMIN_IP=${NGINX_ADMIN_IP:-127.0.0.1}
      - JENKINS_UPSTREAM=jenkins:${JENKINS_PORT_INTERNAL:-80}
    volumes:
      - ./service/nginx/conf/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./service/nginx/conf/proxy_params:/etc/nginx/templates/proxy_params.template:ro
      - ./service/nginx_logs:/var/log/nginx
    depends_on:
      jenkins:
        condition: service_healthy
    restart: always
    networks:
      - jenkins_net
    healthcheck:
      test: curl -fsSL http://localhost:${FIREWALL_PORT_INTERNAL:-8080}/healthz || exit 1
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  jenkins_net:
    name: jenkins_net
    driver: bridge
